# Releases on every push to main whose manifest.json version has no tag yet:
# bump the version ("chore: bump version to X.Y.Z"), merge to main, and this
# tags vX.Y.Z and publishes the Chrome/Edge zip and the Firefox zip with notes
# from the commits since the last release. Pushes that keep the version do nothing.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the publish job can write; nothing downloaded from npm runs with that token
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        id: version
        run: |
          version="$(jq -r .version manifest.json)"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error file=manifest.json::version '$version' is not a valid extension version"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released, nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Mozilla's linter comes from npm, so it runs on its own runner: it can stop a
  # release, but can't touch the packages that get published
  lint-firefox:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint the Firefox package
        run: |
          node scripts/build.mjs firefox "$RUNNER_TEMP/dist"
          npx --yes web-ext@10.7.0 lint --source-dir "$RUNNER_TEMP/dist/firefox"

  publish:
    needs: [version, lint-firefox]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build packages
        id: package
        run: |
          bash .github/scripts/package.sh "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/zips.txt"
          echo "chrome=$(sed -n 1p "$RUNNER_TEMP/zips.txt")" >> "$GITHUB_OUTPUT"
          echo "firefox=$(sed -n 2p "$RUNNER_TEMP/zips.txt")" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          bash .github/scripts/release-notes.sh > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          CHROME_ZIP: ${{ steps.package.outputs.chrome }}
          FIREFOX_ZIP: ${{ steps.package.outputs.firefox }}
        run: |
          gh release create "$TAG" "$CHROME_ZIP" "$FIREFOX_ZIP" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"
